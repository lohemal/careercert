[package]
name = "career_cert"
version = "0.1.1"
description = "방과후 강사 경력증명서 발급 시스템"
authors = ["lohemal"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "career_cert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup", "serialize"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
uuid = { version = "1", features = ["v4"] }
# 출력 창과 주고받는 신호(한 번에 한 작업, 시간 제한). tauri 가 이미 쓰는 tokio 다.
tokio = { version = "1", features = ["sync", "time"] }
# 주민번호·주소 암호화(AES-256-GCM)와 문서 지문(HMAC-SHA256)
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
zeroize = "1"
# 복구 비밀번호 → 키 감싸기용 키(KEK). 비밀번호 자체는 어디에도 저장하지 않는다
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# 엑셀(.xlsx·.xlsm) 읽기 — Excel 없이 파일만 읽는다. 매크로(VBA)는 실행하지 않는다(실행 기능이 없다)
calamine = "0.30"
# 정식 PDF 저장 위치 고르기 (Rust 에서만 부른다 — 경로가 화면으로 가지 않는다)
tauri-plugin-dialog = "2"
# 앱 안 자동 업데이트 (서명 확인은 플러그인이 한다)
tauri-plugin-updater = "2"

# WebView2 설정을 직접 바꾸려고(입력 자동완성 저장 끄기 — 주민번호·주소가 브라우저 프로필에 남지 않게).
# 버전은 tauri/wry 가 쓰는 것과 같게 둔다(Cargo.lock 의 webview2-com 0.39 · windows 0.62).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_Graphics_Printing", "Win32_Security_Cryptography", "Win32_Foundation"] }

[dev-dependencies]
# 시험용 엑셀 파일 만들기 (가상값만)
rust_xlsxwriter = "0.89"

# 개발 빌드에서도 Argon2 는 최적화한다 — 안 하면 비밀번호 확인 한 번에 수십 초 걸린다
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
