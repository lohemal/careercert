[package]
name = "career_cert"
version = "0.0.1"
description = "방과후 강사 경력증명서 발급 시스템"
authors = ["lohemal"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "career_cert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
